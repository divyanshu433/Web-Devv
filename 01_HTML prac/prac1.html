<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <table border="Black">
            <caption>Student Information</caption>
            <tr>
                <th rowspan="6">Info</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>City</th>
                <th>House</th>
            </tr>
            <tr>
                <td>A</td>
                <td>Delhi</td>
                <td>1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>Mumbai</td>
                <td>2</td>
            </tr>
            <tr>
                <td>C</td>
                <td>Kolkata</td>
                <td>3</td>
            </tr>
            <tr>
                <td>D</td>
                <td>Pune</td>
                <td>4</td>
            </tr>
        </table>
    </div>
    <hr>
    <div>
        <form action="/server">
            <div>
                <label for="name">Name : </label>
                <input type="text" id="name" name="name">
            </div>
            <div>
                Sex :
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
            <div>
                <label for="country">Country : </label>
                <select name="country" id="country">
                    <option value="Default">Selct an option</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="Russia">Russia</option>
                    <option value="Spain">Spain</option>
                    <option value="Norway">Norway</option>
                    <option value="Argintina">Argintina</option>
                </select>
            </div>
            <div>
                <div>
                    <label for="comment">Message : </label>
                </div>
                <textarea name="comment" id="comment"></textarea>
            </div>
            <div>
                <input type="checkbox" name="sub" id="sub" value="true">
                <label for="sub">Subscribe?</label>
            </div>
            <button>Submit</button>
        </form>
    </div>
    <hr>
    <div>
        <h3>Feedback Form</h3>
        <div>
            <label for="name">Name : </label>
            <input type="text" placeholder="Write your name" id="name" name="name">
        </div>
        <br>
        <div>
            <label for="email">Email : </label>
            <input type="text" placeholder="Write your email" id="email" name="email">
        </div>
        <br>
        <div>
            <div>
                <label for="message">Message</label>
            </div>
            <textarea name="messaeg" id="message"></textarea>
        </div>
        <br>
        <div>
            <div>
                <label for="rating">Rate us out of 5 : </label>
            </div>
            <div>
                <input type="radio" id="1" name="rating">
                <label for="1">1</label>
            </div>
            <div>
                <input type="radio" id="2" name="rating">
                <label for="2">2</label>
            </div>
            <div>
                <input type="radio" id="3" name="rating">
                <label for="3">3</label>
            </div>
            <div>
                <input type="radio" id="4" name="rating">
                <label for="4">4</label>
            </div>
            <div>
                <input type="radio" id="5" name="rating5">
                <label for="5">5</label>
            </div>
            <button>Send your message</button>
        </div>
    </div>

</body>

</html>
