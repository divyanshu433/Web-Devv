<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/server">
        <input type="checkbox" name="age" id="age">
        <label for="age">I am 18+</label>
        <button>submit</button>

        <div>
            <input type="radio" name = "fruit" id = "apple" value="apple">
            <label for="apple">apple</label>

            <input type="radio" name = "fruit" id = "mango" value="mango">
            <label for="mango">mango</label>

            <input type="radio" name = "fruit" id = "banana" value="banana">
            <label for="banana">banana</label>
        </div>

        <div>
            <label for="profession">Select</label>
            <select name="profession" id="profession">
                <option value="stu">Student</option>
                <option value="Dev">Developer</option>
            </select>
        </div>
        <div>
            <label for="volume">Select Volume</label>
            <input type="range" id="vol" min="0" max="100" name="volume" step="10">
        </div>

        <div>
            <label for="textarea">Comment</label>
            <textarea name="comment" id="textarea" name="textarea" placeholder="Write your feedback"></textarea>
        </div>
    </form>
</body>
</html>
